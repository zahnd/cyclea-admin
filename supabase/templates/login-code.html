<!-- Sign-in code for Cyclea Admin. Sent by signInWithOtp, which uses the
     "magic link" template slot. Deliberately no link: the code is typed into
     our own sign-in page. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #171717; max-width: 480px;">
  <p style="font-size: 16px;">Your Cyclea Admin sign-in code:</p>
  <p style="font-size: 32px; font-weight: 600; letter-spacing: 6px; margin: 24px 0;">{{ .Token }}</p>
  <p style="font-size: 14px; color: #525252;">It expires in 10 minutes and works once.</p>
  <p style="font-size: 14px; color: #525252;">If you did not try to sign in, ignore this email. Nobody can get in with the code alone; an authenticator code is needed too.</p>
</div>
